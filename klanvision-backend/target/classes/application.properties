# ── Klanvision Backend Configuration ──
spring.application.name=klanvision-backend
server.port=8080

# ── Database (H2 for development, switch to MySQL for production) ──
# ── Database (MySQL) ──
spring.datasource.url=jdbc:mysql://localhost:3306/klanvision?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# H2 Console (Disabled for MySQL use)
spring.h2.console.enabled=false

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ── JWT Configuration ──
app.jwt.secret=KlanVision2025SecureJWTSecretKeyMustBeAtLeast256BitsLong!!
app.jwt.expiration=86400000

# ── CORS ──
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,https://www.klanvision.com
